<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=0">
  <link rel="manifest" href="manifest.json">
  <link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
  <title>Alerte SOS</title>
  <style>
    :root { --red: #e11d48; --bg: #f1f5f9; --text: #0f172a; }
    * { box-sizing: border-box; }
    body { font-family: -apple-system, BlinkMacSystemFont, Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 15px; margin: 0; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 450px; }
    .card { background: white; padding: 18px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .data-group { display: flex; flex-direction: column; gap: 12px; }
    .label { font-size: 0.65rem; color: #64748b; text-transform: uppercase; font-weight: 800; }
    .val { font-size: 0.9rem; font-weight: 700; word-break: break-all; margin-top: 2px; }
    .btn { display: flex; align-items: center; justify-content: center; gap: 10px; width: 100%; padding: 22px; border-radius: 12px; border: none; font-size: 1.3rem; font-weight: 800; text-decoration: none; color: white; background: var(--red); box-shadow: 0 4px 6px -1px rgba(225, 29, 72, 0.3); transition: transform 0.1s; }
    .btn:active { transform: scale(0.97); }
    .config { text-align: center; font-size: 0.8rem; color: #94a3b8; margin-top: 20px; cursor: pointer; padding: 10px; }
  </style>
</head>
<body>

<div class="app-container">
  <div class="card">
    <div class="data-group">
      <div><div class="label">Adresse</div><div class="val" id="address">Calcul...</div></div>
      <div><div class="label">GPS (DD)</div><div class="val" id="gps-dd">-</div></div>
      <div><div class="label">GPS (DMS)</div><div class="val" id="gps-dms">-</div></div>
    </div>
  </div>

  <a id="sos-btn" class="btn">
    <span class="material-icons" style="font-size:28px">emergency</span> SOS URGENT
  </a>

  <div class="config" onclick="toggleConfig()">⚙️ Configurer le numéro d'urgence</div>

  <div id="config-panel" class="card" style="display:none;">
    <label style="font-size: 0.8rem; font-weight:bold;">Numéro SMS d'urgence :</label>
    <input id="cfg-phone" style="width:100%; padding:10px; margin: 8px 0 15px; border-radius:8px; border:1px solid #ccc;">
    <button class="btn" style="padding:10px; font-size:1rem;" onclick="saveConfig()">Enregistrer</button>
  </div>
</div>

<script>
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js');
  
  let pos = {lat:0, lon:0, addr:'', dd:'', dms:''};

  function toDMS(d, lat) {
    const deg = Math.floor(Math.abs(d));
    const min = Math.floor((Math.abs(d) - deg) * 60);
    const sec = ((Math.abs(d) - deg - min/60) * 3600).toFixed(0);
    const dir = lat ? (d >= 0 ? "N" : "S") : (d >= 0 ? "E" : "O");
    return `${deg}°${min}'${sec}"${dir}`;
  }

  navigator.geolocation.watchPosition(p => {
    pos.lat = p.coords.latitude; 
    pos.lon = p.coords.longitude;
    pos.dd = `${pos.lat.toFixed(6)}, ${pos.lon.toFixed(6)}`;
    pos.dms = `${toDMS(pos.lat, true)} ${toDMS(pos.lon, false)}`;
    
    document.getElementById('gps-dd').innerText = pos.dd;
    document.getElementById('gps-dms').innerText = pos.dms;
    
    fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${pos.lon}&lat=${pos.lat}`)
      .then(r => r.json())
      .then(d => { 
        pos.addr = d.features[0]?.properties.label || "Adresse non trouvée"; 
        document.getElementById('address').innerText = pos.addr; 
        updateSMS(); 
      });
  }, null, {enableHighAccuracy: true});

  function updateSMS() {
    const phone = localStorage.getItem('cfg-phone') || "";
    const msg = `SOS - Aide nécessaire. Adresse: ${pos.addr} | GPS(DD): ${pos.dd} | GPS(DMS): ${pos.dms}`;
    document.getElementById('sos-btn').href = `sms:${phone}?body=${encodeURIComponent(msg)}`;
  }

  function toggleConfig() { document.getElementById('config-panel').style.display = 'block'; }
  function saveConfig() {
    localStorage.setItem('cfg-phone', document.getElementById('cfg-phone').value);
    document.getElementById('config-panel').style.display = 'none';
    updateSMS();
  }

  document.getElementById('cfg-phone').value = localStorage.getItem('cfg-phone') || "";
  updateSMS();
</script>
</body>
</html>
