<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="manifest" href="manifest.json">
  <title>Sécurité Famille</title>
  <style>
    :root { --red: #e11d48; --blue: #2563eb; --bg: #f1f5f9; --text: #0f172a; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); padding: 20px; }
    .card { background: white; padding: 20px; border-radius: 16px; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); margin-bottom: 20px; }
    .data-row { margin-bottom: 15px; }
    .label { font-size: 0.75rem; color: #64748b; text-transform: uppercase; letter-spacing: 0.05em; font-weight: 700; }
    .val { font-size: 1rem; font-weight: 600; margin-top: 4px; }
    .btn { display: block; width: 100%; padding: 20px; border-radius: 12px; border: none; font-size: 1.2rem; font-weight: 800; text-align: center; text-decoration: none; margin-bottom: 15px; color: white; transition: transform 0.1s; }
    .btn:active { transform: scale(0.98); }
    .btn-sos { background: var(--red); }
    .btn-live { background: var(--blue); }
    #config { font-size: 0.8rem; color: #94a3b8; text-align: center; margin-top: 20px; cursor: pointer; }
  </style>
</head>
<body>

<div class="card">
  <div class="data-row">
    <div class="label">Adresse actuelle</div>
    <div class="val" id="address">Calcul...</div>
  </div>
  <div class="data-row">
    <div class="label">GPS (DD)</div>
    <div class="val" id="gps-dd">-</div>
  </div>
  <div class="data-row">
    <div class="label">GPS (DMS)</div>
    <div class="val" id="gps-dms">-</div>
  </div>
</div>

<a id="sos-btn" class="btn btn-sos">SOS URGENT</a>
<a id="live-btn" class="btn btn-live" target="_blank">SUIVI TEMPS RÉEL</a>

<div id="config" onclick="toggleConfig()">⚙️ Configurer (Lien Live & Numéro)</div>

<div id="config-panel" class="card" style="display:none;">
  <label>Numéro SMS Urgence :</label>
  <input id="cfg-phone" style="width:100%; padding:8px; margin: 5px 0 15px;">
  <label>Lien "Partage de position" (Google Maps) :</label>
  <input id="cfg-link" style="width:100%; padding:8px; margin: 5px 0 15px;">
  <button class="btn btn-blue" onclick="saveConfig()" style="padding:10px">Enregistrer</button>
</div>

<script>
  let pos = {lat:0, lon:0, dd:'', dms:'', addr:''};

  function toDMS(d, lat) {
    const deg = Math.floor(Math.abs(d));
    const min = Math.floor((Math.abs(d) - deg) * 60);
    const sec = ((Math.abs(d) - deg - min/60) * 3600).toFixed(0);
    const dir = lat ? (d >= 0 ? "N" : "S") : (d >= 0 ? "E" : "O");
    return `${deg}°${min}'${sec}"${dir}`;
  }

  navigator.geolocation.watchPosition(p => {
    pos.lat = p.coords.latitude;
    pos.lon = p.coords.longitude;
    pos.dd = `${pos.lat.toFixed(6)}, ${pos.lon.toFixed(6)}`;
    pos.dms = `${toDMS(pos.lat, true)} ${toDMS(pos.lon, false)}`;
    document.getElementById('gps-dd').innerText = pos.dd;
    document.getElementById('gps-dms').innerText = pos.dms;
    
    fetch(`https://api-adresse.data.gouv.fr/reverse/?lon=${pos.lon}&lat=${pos.lat}`)
      .then(r => r.json())
      .then(d => {
        pos.addr = d.features[0]?.properties.label || "Adresse non trouvée";
        document.getElementById('address').innerText = pos.addr;
        updateLinks();
      });
  }, null, {enableHighAccuracy: true});

  function updateLinks() {
    const phone = localStorage.getItem('cfg-phone') || "";
    const link = localStorage.getItem('cfg-link') || "#";
    document.getElementById('sos-btn').href = `sms:${phone}?body=SOS - Je suis en difficulté. Voici ma position : ${pos.addr} (GPS: ${pos.dd}). Suivi Live: ${link}`;
    document.getElementById('live-btn').href = link;
  }

  function toggleConfig() { document.getElementById('config-panel').style.display = 'block'; }
  function saveConfig() {
    localStorage.setItem('cfg-phone', document.getElementById('cfg-phone').value);
    localStorage.setItem('cfg-link', document.getElementById('cfg-link').value);
    document.getElementById('config-panel').style.display = 'none';
    updateLinks();
  }

  // Init
  document.getElementById('cfg-phone').value = localStorage.getItem('cfg-phone') || "";
  document.getElementById('cfg-link').value = localStorage.getItem('cfg-link') || "";
  updateLinks();
</script>
</body>
</html>
